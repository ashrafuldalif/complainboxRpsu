<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RPSU Complaint Box</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Work+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="grain"></div>

    <div class="container">
        <header class="header">
            <div class="header-ornament"></div>
            <h1 class="title">RPSU</h1>
            <p class="subtitle">Complaint Box</p>
            <div class="header-line"></div>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
                <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="5" stroke-width="2" />
                    <line x1="12" y1="1" x2="12" y2="3" stroke-width="2" />
                    <line x1="12" y1="21" x2="12" y2="23" stroke-width="2" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke-width="2" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke-width="2" />
                    <line x1="1" y1="12" x2="3" y2="12" stroke-width="2" />
                    <line x1="21" y1="12" x2="23" y2="12" stroke-width="2" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke-width="2" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke-width="2" />
                </svg>
                <svg class="theme-icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-width="2" />
                </svg>
            </button>
        </header>

        <main class="main-content">
            <div class="login-form-container">
                <h2>Create Your Account</h2>
                <form id="registerForm" class="login-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="student_id">Student ID</label>
                        <input type="text" id="student_id" name="student_id" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@rpsu.edu.bd" required>
                        <small class="form-note">Must be a valid @rpsu.edu.bd email</small>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="login-btn">Register</button>
                </form>
                <div class="register-link">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
                </div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>
        </main>

        <footer class="footer">
            <p>R. P. Shaha University </p>
            <p class="footer-note">All complaints are treated confidentially</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
