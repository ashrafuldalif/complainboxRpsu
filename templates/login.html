<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RPSU Complaint Box</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Work+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="grain"></div>

    <div class="container">
        <header class="header">
            <div class="header-ornament"></div>
            <h1 class="title">RPSU</h1>
            <p class="subtitle">Complaint Box</p>
            <div class="header-line"></div>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fa-solid fa-sun theme-icon sun"></i>
                <i class="fa-solid fa-moon theme-icon moon"></i>
            </button>
        </header>

        <main class="main-content">
            <div class="login-form-container">
                <h2>Login to Your Account</h2>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@rpsu.edu.bd" required>
                        <small class="form-note">Must be a valid @rpsu.edu.bd email</small>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                </form>
                <div class="register-link">
                    <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                </div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>
        </main>

        <footer class="footer">
            <p>R. P. Shaha University </p>
            <p class="footer-note">All complaints are treated confidentially</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
