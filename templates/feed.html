<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints Feed - RPSU Complaint Box</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/feed.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="feed-header">
            <h1>Complaints Feed</h1>
            <div class="header-controls">
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-sun theme-icon sun"></i>
                    <i class="fa-solid fa-moon theme-icon moon"></i>
                </button>
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>
        <div id="complaints-feed">
            {% for complaint in complaints %}
            <div class="complaint-card" data-id="{{ complaint.id }}">
                {% if complaint.image_path %}
                <img src="{{ url_for('static', filename=complaint.image_path) }}" alt="Complaint Image"
                    class="complaint-image">
                {% endif %}
                <div class="complaint-content">
                    <h3>{{ complaint.subject }}</h3>
                    <p class="complaint-text">{{ complaint.complaint }}</p>
                    <p class="complaint-time">{{ complaint.created_at }}</p>
                    <div class="vote-buttons">
                        <button class="agree-btn {% if user_votes.get(complaint.id) == 'agree' %}voted{% endif %}"
                            data-id="{{ complaint.id }}">
                            Agree <span class="agree-count">{{ complaint.agree_count }}</span>
                        </button>
                        <button class="disagree-btn {% if user_votes.get(complaint.id) == 'disagree' %}voted{% endif %}"
                            data-id="{{ complaint.id }}">
                            Disagree <span class="disagree-count">{{ complaint.disagree_count }}</span>
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/feed.js') }}"></script>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
        <button class="lightbox-close" aria-label="Close image">&times;</button>
        <img id="lightbox-img" src="" alt="Full size complaint image">
    </div>
</body>

</html>
